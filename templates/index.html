<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tamil Nadu Tourism</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h2>TN Tourism</h2>

        <nav>
            <a href="/">Home</a>
            <a href="/destinations">Destinations</a>
            <a href="/booking">Booking</a>
        </nav>
    </header>


    <!-- HERO SECTION -->
    <section class="hero">

        <div>
            <h1>Explore Tamil Nadu</h1>

            <p>
                Discover Culture, Heritage and Natural Beauty
            </p>

            <a href="/destinations" class="btn">
                Explore Now
            </a>
        </div>

    </section>


    <!-- POPULAR DESTINATIONS -->
    <section class="section">

        <h2>Popular Tourist Destinations</h2>

        <div class="cards">

            {% for place in destinations %}

            <div class="card">

                <img src="{{ place.image }}" alt="{{ place.name }}">

                <h3>{{ place.name }}</h3>

                <p>{{ place.description }}</p>

                <a href="/booking" class="btn">
                    Book Now
                </a>

            </div>

            {% endfor %}

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 Tamil Nadu Tourism | Explore Tamil Nadu
        </p>

    </footer>

</body>
</html>
