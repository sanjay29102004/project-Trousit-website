<!DOCTYPE html>
<html>
<head>
<title>User Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <h2>TN Tourism Dashboard</h2>
    <nav>
        <a href="/">Home</a>
        <a href="/destinations">Destinations</a>
        <a href="/booking">Book Hotel</a>
        <a href="/logout">Logout</a>
    </nav>
</header>

<section class="dashboard">
    <h1>Welcome, {{ name }}!</h1>
    <p>Welcome to Tamil Nadu Tourism.</p>

    <div class="dashboard-card">
        <h2>Plan Your Trip</h2>
        <p>Discover beautiful destinations in Tamil Nadu.</p>
        <a href="/destinations" class="btn">Explore Places</a>
    </div>

    <div class="dashboard-card">
        <h2>Hotel Booking</h2>
        <p>Book your hotel for your next trip.</p>
        <a href="/booking" class="btn">Book Now</a>
    </div>
</section>

</body>
</html>
